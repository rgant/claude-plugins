name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Ruff lint
        run: uvx ruff@0.17.5 check .
      - name: Ruff format
        run: uvx ruff@0.17.5 format --check .
      - name: Shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck
      - name: Actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  tests:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # The hooks run through `uv run --python ">=3.14"`, so test the floor.
        python: ["3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install Python
        run: uv python install ${{ matrix.python }}
      - name: Repo tests
        run: |
          set -euo pipefail
          shopt -s nullglob
          for test in tests/test_*.py; do
            echo "== $test"
            uv run --no-project --python ${{ matrix.python }} "$test"
          done
      - name: Plugin tests
        run: |
          set -euo pipefail
          shopt -s nullglob
          for test in plugins/*/tests/test_*.py; do
            echo "== $test"
            uv run --no-project --python ${{ matrix.python }} "$test"
          done

  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.325
      - name: Validate the marketplace and plugins
        run: claude plugin validate .
